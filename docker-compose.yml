version: "3.8"

services:
  transfer-manager:
    build: .
    container_name: telegram_transfer_manager
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:10000"
      - "10000:10000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/telegram.db
      - SESSION_DIRECTORY=/app/data/sessions
      - DOWNLOAD_DIRECTORY=/app/downloads
      - PORT=10000

