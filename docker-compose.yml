version: "3.8"

services:
  transfer-manager:
    build: .
    container_name: telegram_transfer_manager
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/telegram.db
      - SESSION_DIRECTORY=/app/data/sessions

